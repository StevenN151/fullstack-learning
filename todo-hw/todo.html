<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo Homework</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="todo.css" />
  </head>
  <body>
    <div id="app">
      <div>
        <h1>Todos</h1>
      </div>

      <div>
        <input type="text" class="input" placeholder="What need to be done?" />
        <div class="task-list">
          <div>
            <p>task 1</p>
            <p>task 2</p>
          </div>
          <div class="footer">
            <div class="items-btn">items left!</div>
            <div>
              <button class="all-btn">All</button>
              <button class="active-btn">Active</button>
              <button class="completed-btn">Completed</button>
            </div>
            <div>
              <button class="clear-btn">Clear completed</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
